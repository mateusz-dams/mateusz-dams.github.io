<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Strona główna</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&amp;display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="home">
<header class="header">
    <div class="container">
        <div class="header__columns">
            <div class="header__column">
                <a href="index.html" class="header__logo">
                    <img src="img/logo-leadtrust.svg" alt="Logo Leadtrust Group">
                </a>
            </div>
            <div class="header__column">
                <div class="header__items">
                    <nav class="header__nav">
                        <ul>
                            <li>
                                <a href="kontakt.html">Kontakt</a>
                            </li>
                        </ul>
                    </nav>
                    <nav class="header__nav header__lang">
                        <ul>
                            <li>
                                <a class="active" href="#">PL</a>
                            </li>
                            <li>
                                <a href="#">EN</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</header>
<section class="section--pt section--pb who-are-you">
    <div class="container">
        <div class="section__content">
            <header class="section__header">
                <h1 class="section__title">Szukasz pracy? Szukasz personelu?</h1>
                <h5 class="section__subtitle">Wybierz kim jesteś</h5>
            </header>
            <div class="who-are-you__columns">
                <div class="who-are-you__column">
                    <figure class="who-are-you__img">
                        <a href="#">
                            <img src="img/wybor-pracownik.jpg" alt="Pracownik produkcji przy szlifowaniu metalu">
                        </a>
                        <figcaption class="who-are-you__caption">
                            <header class="who-are-you__header">
                                <h6 class="who-are-you__suptitle">
                                    Jestem
                                </h6>
                                <h2 class="who-are-you__title">
                                    Pracownikem
                                </h2>
                            </header>
                        </figcaption>
                    </figure>
                </div>
                <div class="who-are-you__column">
                    <figure class="who-are-you__img">
                        <a href="#">
                            <img src="img/wybor-pracodawca.jpg" alt="Pracodawca przy laptopie">
                        </a>
                        <figcaption class="who-are-you__caption">
                            <header class="who-are-you__header">
                                <h6 class="who-are-you__suptitle">
                                    Jestem
                                </h6>
                                <h2 class="who-are-you__title">
                                    Pracodawcą
                                </h2>
                            </header>
                        </figcaption>
                    </figure>
                </div>
            </div>
        </div>
    </div>
</section>
