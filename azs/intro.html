<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kontakt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,700&family=Inter:wght@400;700&family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="page-intro">
<section class="intro">
    <figure class="intro__background">
        <img src="img/intro-lekarz.jpg" alt="Lekarz przy laptopie">
    </figure>
    <div class="section--pt section--pb intro__content">
        <div class="container">
            <div class="section__content">
                <figure class="intro__logo">
                    <img src="img/logo-uniwersytet-zdrowia.svg" alt="Logo Uniwersytetu Zdrowia">
                </figure>
                <header class="section__header">
                    <h1 class="section__title">
                        Wybierz temat, który Cię interesuje:
                    </h1>
                </header>
                <div class="intro__columns">
                    <div class="intro__column">
                        <figure class="intro__img">
                            <a href="#">
                                <img src="img/hero-slajd.jpg" alt="Lekarz badający zmiany skórne na dłoni pacjenta">
                            </a>
                            <figcaption class="intro__caption">
                                <header class="intro__header">
                                    <h5 class="intro__title">
                                        <a href="#">Atopowe Zapalenie Skóry</a>
                                    </h5>
                                </header>
                            </figcaption>
                        </figure>
                    </div>
                    <div class="intro__column">
                        <figure class="intro__img">
                            <a href="#">
                                <img src="img/zmiany-skorne-dlonie.jpg" alt="Zmiany skórne na dłoniach">
                            </a>
                            <figcaption class="intro__caption">
                                <header class="intro__header">
                                    <h5 class="intro__title">
                                        <a href="#">Łuszczyca</a>
                                    </h5>
                                </header>
                            </figcaption>
                        </figure>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer class="footer">
        <div class="container">
            <div class="footer__columns">
                <div class="footer__column">
                    <div class="footer__items">
                        <div class="footer__copyright">
                            <strong>Atopowe Zapalenie Skóry</strong> © 2023 Wszystkie prawa zastrzeżone.
                        </div>
                        <div class="footer__webdesign">
                            <span>Projekt graficzny:</span>
                            <img src="img/logo-ajmer.svg" alt="Logo Ajmer">
                        </div>
                    </div>
                </div>
                <div class="footer__column">
                    <nav class="footer__nav">
                        <ul>
                            <li>
                                <a href="#">
                                    POLITYKA PRYWATNOŚCI
                                </a>
                            </li>
                            <li>
                                <a href="#">
                                    REGULAMIN
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </footer>
</section>
<script src="js/scripts.js"></script>
</body>
</html>
